spring.application.name=psychologist-site
server.port=${PORT:8080}

# Texts: messages_uk.properties (default) and messages_ru.properties
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

server.compression.enabled=true
spring.web.resources.cache.cachecontrol.max-age=7d

# Contact details and links. Replace the placeholders with the client's real data.
site.phone=[+380 XX XXX XX XX]
site.phone-href=tel:+380000000000
site.email=[email@example.com]
site.email-href=mailto:email@example.com
site.instagram=https://instagram.com/
site.messenger=https://m.me/
site.telegram=https://t.me/
site.facebook=https://facebook.com/
site.linkedin=https://linkedin.com/

# Booking form JSON sends "phone", "email", ... (enum names are upper case in Java)
spring.jackson.mapper.accept-case-insensitive-enums=true
