name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Compile, test and package the Java app
        run: ./mvnw -B verify

      - name: Build static placeholder for GitHub Pages
        run: .github/scripts/build-site.sh

      - name: Upload the app (runnable jar) for preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-jar-pr-${{ github.event.pull_request.number }}
          path: target/*.jar
          retention-days: 7
